name: Build AS MARBLE WORK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Icon
        run: |
          mkdir -p www assets
          cp index.html www/
          cp admin.html www/
          cp IMG_20251221_203305_875.jpg assets/icon.jpg

      - name: Initialize Capacitor & Generate App Icon
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "AS MARBLE WORK" "com.asmarble.makrana" --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-MARBLE-WORK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
